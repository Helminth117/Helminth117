# Genera la serpiente que se come la gráfica de contribuciones, en blanco y negro,
# y la publica en la rama "output" (el README la enlaza desde ahí).
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/serpiente.yml

permissions:
  contents: write

concurrency:
  group: serpiente
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente-claro.svg?color_snake=#0D0D0D&color_dots=#EBEBEB,#C4C4C4,#8A8A8A,#525252,#0D0D0D
            dist/serpiente-oscuro.svg?color_snake=#F5F5F5&color_dots=#161B22,#3A3A3A,#6E6E6E,#A3A3A3,#F5F5F5

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Serpiente actualizada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
